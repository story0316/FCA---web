<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR OS — 시스템 마인드맵</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0F172A;
  --surface: #1E293B;
  --border: #334155;
  --text: #F1F5F9;
  --muted: #94A3B8;
  --accent: #6366F1;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── 헤더 ── */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(15,23,42,.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex; align-items: center; gap: 14px;
}
.header-logo { font-size: 24px; }
.header-title { font-size: 16px; font-weight: 800; }
.header-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
.header-search {
  margin-left: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 14px;
  color: var(--text);
  font-size: 13px;
  width: 220px;
  outline: none;
}
.header-search:focus { border-color: var(--accent); }
.header-search::placeholder { color: var(--muted); }

/* ── 뷰 토글 ── */
.view-toggle {
  display: flex; gap: 6px;
  padding: 14px 20px 0;
}
.view-btn {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-size: 12px; font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}
.view-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* ── 통계 배지 ── */
.stats-bar {
  display: flex; gap: 12px; flex-wrap: wrap;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
}
.stat-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 11px; color: var(--muted);
}
.stat-chip strong { color: var(--text); font-size: 13px; }

/* ── 마인드맵 뷰 ── */
#mindmap-view {
  padding: 24px 20px 60px;
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px;
}

/* 도메인 카드 */
.domain-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  transition: border-color .2s, transform .15s;
}
.domain-card:hover { transform: translateY(-1px); }

.domain-header {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px;
  cursor: pointer;
  user-select: none;
}
.domain-icon { font-size: 28px; flex-shrink: 0; }
.domain-meta { flex: 1; min-width: 0; }
.domain-name-ko { font-size: 14px; font-weight: 800; }
.domain-name-en { font-size: 10px; font-weight: 600; opacity: .7; margin-top: 1px; }
.domain-count {
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 20px;
  background: rgba(255,255,255,.08);
  flex-shrink: 0;
}
.domain-arrow {
  font-size: 16px; color: var(--muted);
  transition: transform .2s;
  flex-shrink: 0;
}
.domain-card.open .domain-arrow { transform: rotate(90deg); }

/* 서브그룹 */
.domain-body {
  display: none;
  padding: 0 18px 16px;
  border-top: 1px solid var(--border);
}
.domain-card.open .domain-body { display: block; }

.subgroup-label {
  font-size: 10px; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase;
  padding: 12px 0 6px;
  opacity: .7;
}

.feature-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.feature-link {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 10px;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border);
  border-radius: 10px;
  text-decoration: none;
  color: var(--text);
  font-size: 12px; font-weight: 600;
  transition: all .15s;
  cursor: pointer;
}
.feature-link:hover {
  background: rgba(255,255,255,.09);
  border-color: var(--hover-color, var(--accent));
  color: var(--hover-color, var(--accent));
  transform: translateY(-1px);
}
.feature-icon { font-size: 17px; flex-shrink: 0; line-height: 1; }

/* 관리자 전용 배지 */
.admin-badge {
  font-size: 9px; padding: 1px 5px;
  background: rgba(99,102,241,.25); color: #A5B4FC;
  border-radius: 4px; margin-left: auto; flex-shrink: 0;
}

/* ── 테이블 뷰 ── */
#table-view { display: none; padding: 20px; }
.table-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.table-wrap table {
  width: 100%; border-collapse: collapse;
}
.table-wrap th {
  text-align: left; font-size: 11px; font-weight: 700;
  color: var(--muted); text-transform: uppercase; letter-spacing: .05em;
  padding: 10px 16px;
  background: rgba(255,255,255,.04);
  border-bottom: 1px solid var(--border);
}
.table-wrap td {
  padding: 9px 16px;
  font-size: 13px;
  border-bottom: 1px solid rgba(255,255,255,.04);
  vertical-align: middle;
}
.table-wrap tr:last-child td { border-bottom: none; }
.table-wrap tr:hover td { background: rgba(255,255,255,.04); }
.table-wrap a { color: var(--text); text-decoration: none; }
.table-wrap a:hover { color: var(--accent); }
.domain-chip {
  display: inline-block;
  font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: 20px;
  white-space: nowrap;
}

/* ── 검색 하이라이트 ── */
.hidden { display: none !important; }
mark { background: rgba(99,102,241,.4); color: #fff; border-radius: 3px; padding: 0 2px; }

/* ── 반응형 ── */
@media (min-width: 600px) {
  .feature-grid { grid-template-columns: 1fr 1fr 1fr; }
  #mindmap-view { grid-template-columns: 1fr 1fr; gap: 16px; }
}
@media (min-width: 1024px) {
  .feature-grid { grid-template-columns: 1fr 1fr 1fr 1fr; }
  #mindmap-view { grid-template-columns: 1fr 1fr 1fr; }
}

/* 페이지 상단 앵커 */
.back-to-top {
  position: fixed; bottom: 20px; right: 20px;
  width: 40px; height: 40px;
  background: var(--accent);
  border: none; border-radius: 50%;
  color: #fff; font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 14px rgba(99,102,241,.5);
  opacity: 0; pointer-events: none;
  transition: opacity .2s;
  z-index: 200;
}
.back-to-top.visible { opacity: 1; pointer-events: auto; }

// ══════════════════════════════════════════════
//  유틸
// ══════════════════════════════════════════════
function buildAppUrl(hash) {
  return APP_BASE + hash;
}

function totalFeatures() {
  return DOMAINS.reduce((s, d) => s + d.features.length, 0);
}

// ══════════════════════════════════════════════
//  통계 배지 렌더
// ══════════════════════════════════════════════
function renderStats() {
  const bar = document.getElementById('stats-bar');
  const adminCount = DOMAINS.reduce((s,d) => s + d.features.filter(f=>f.roles).length, 0);
  bar.innerHTML = [
    ['🗂️ 도메인', DOMAINS.length],
    ['⚡ 전체 기능', totalFeatures()],
    ['👤 직원 기능', totalFeatures() - adminCount],
    ['🔧 관리자 기능', adminCount],
  ].map(([l,v]) => `<div class="stat-chip"><span>${l}</span><strong>${v}</strong></div>`).join('');
}

// ══════════════════════════════════════════════
//  마인드맵 뷰 렌더
// ══════════════════════════════════════════════
function renderMindmap(filter = '') {
  const container = document.getElementById('mindmap-view');

  const cards = DOMAINS.map(domain => {
    const groups = {};
    domain.features.forEach(f => {
      if (!groups[f.group]) groups[f.group] = [];
      groups[f.group].push(f);
    });

    // 필터링
    let hasMatch = false;
    const groupHtml = Object.entries(groups).map(([grp, items]) => {
      const filtered = filter
        ? items.filter(f => f.title.includes(filter) || grp.includes(filter) || domain.nameKo.includes(filter))
        : items;
      if (!filtered.length) return '';
      hasMatch = true;

      const links = filtered.map(f => {
        const isAdmin = f.roles && f.roles.includes('admin');
        const url = buildAppUrl(f.hash);
        return `<a class="feature-link" href="${url}" style="--hover-color:${domain.color}">
          <span class="feature-icon">${f.icon}</span>
          <span>${highlight(f.title, filter)}</span>
          ${isAdmin ? '<span class="admin-badge">관리자</span>' : ''}
        </a>`;
      }).join('');

      return `<div class="subgroup-label" style="color:${domain.color}">${grp}</div>
              <div class="feature-grid">${links}</div>`;
    }).join('');

    if (filter && !hasMatch) return '';

    return `<div class="domain-card open" data-id="${domain.id}"
               style="border-color:${domain.color}40">
      <div class="domain-header" onclick="toggleDomain('${domain.id}')"
           style="background:${domain.bg}">
        <span class="domain-icon">${domain.icon}</span>
        <div class="domain-meta">
          <div class="domain-name-ko">${highlight(domain.nameKo, filter)}</div>
          <div class="domain-name-en" style="color:${domain.color}">${domain.name}</div>
        </div>
        <span class="domain-count" style="background:${domain.color}22;color:${domain.color}">
          ${domain.features.length}개
        </span>
        <span class="domain-arrow" style="color:${domain.color}">›</span>
      </div>
      <div class="domain-body">${groupHtml}</div>
    </div>`;
  }).filter(Boolean).join('');

  container.innerHTML = cards || `<div style="grid-column:1/-1;text-align:center;padding:60px;color:#64748B">
    🔍 "<strong>${filter}</strong>" 검색 결과가 없습니다.
  </div>`;
}

function highlight(text, q) {
  if (!q) return text;
  return text.replace(new RegExp(`(${q})`, 'gi'), '<mark>$1</mark>');
}

function toggleDomain(id) {
  const card = document.querySelector(`.domain-card[data-id="${id}"]`);
  if (card) card.classList.toggle('open');
}

// ══════════════════════════════════════════════
//  테이블 뷰 렌더
// ══════════════════════════════════════════════
function renderTable(filter = '') {
  const tbody = document.getElementById('table-body');
  const rows = [];

  DOMAINS.forEach(d => {
    d.features.forEach(f => {
      if (filter && !f.title.includes(filter) && !d.nameKo.includes(filter) && !(f.group||'').includes(filter)) return;
      const isAdmin = f.roles && f.roles.includes('admin');
      const url = buildAppUrl(f.hash);
      rows.push(`<tr>
        <td style="font-size:18px;line-height:1">${f.icon}</td>
        <td><a href="${url}">${highlight(f.title, filter)}</a></td>
        <td><span class="domain-chip" style="background:${d.bg};color:${d.color}">${d.nameKo}</span></td>
        <td style="color:#94A3B8;font-size:12px">${f.group || '—'}</td>
        <td style="font-size:12px">${isAdmin ? '<span style="color:#A5B4FC">관리자</span>' : '<span style="color:#6EE7B7">직원</span>'}</td>
        <td style="font-family:monospace;font-size:11px;color:#64748B">${f.hash}</td>
      </tr>`);
    });
  });

  tbody.innerHTML = rows.length ? rows.join('') :
    `<tr><td colspan="6" style="text-align:center;padding:40px;color:#64748B">검색 결과 없음</td></tr>`;
}

// ══════════════════════════════════════════════
//  뷰 전환
// ══════════════════════════════════════════════
let currentView = 'mindmap';
let currentFilter = '';

function switchView(view) {
  currentView = view;
  document.getElementById('mindmap-view').style.display = view === 'mindmap' ? '' : 'none';
  document.getElementById('table-view').style.display = view === 'table' ? '' : 'none';
  document.querySelectorAll('.view-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });
  if (view === 'table') renderTable(currentFilter);
}

document.querySelectorAll('.view-btn').forEach(btn => {
  btn.addEventListener('click', () => switchView(btn.dataset.view));
});

// ══════════════════════════════════════════════
//  검색
// ══════════════════════════════════════════════
const searchInput = document.getElementById('search');
let searchTimer;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    currentFilter = searchInput.value.trim();
    if (currentView === 'mindmap') renderMindmap(currentFilter);
    else renderTable(currentFilter);
  }, 180);
});

// ══════════════════════════════════════════════
//  Back-to-top
// ══════════════════════════════════════════════
const backTop = document.getElementById('back-top');
window.addEventListener('scroll', () => {
  backTop.classList.toggle('visible', window.scrollY > 300);
});

// ══════════════════════════════════════════════
//  초기화

renderStats();
